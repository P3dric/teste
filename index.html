<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olá Mundo com Estilo</title>
    <style>
        /* O CSS começa aqui */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background-color: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            color: #2d3436;
            margin-bottom: 10px;
        }

        p {
            color: #636e72;
        }

        span {
            color: #0984e3;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Olá, <span>Mundo!</span></h1>
        <p>Minha primeira página estilizada com CSS.</p>
    </div>

</body>
</html>



<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olá Mundo com Fundo Moderno</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;

            /* Fundo gradiente animado - principal destaque */
            background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #1a0033, #2a0a4a);
            background-size: 400% 400%;
            animation: gradientFlow 20s ease infinite;
        }

        @keyframes gradientFlow {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card {
            background-color: white;
            padding: 2.5rem 3rem;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        h1 {
            color: #1e293b;
            margin-bottom: 0.8rem;
            font-size: 3rem;
        }

        p {
            color: #475569;
            font-size: 1.3rem;
        }

        span {
            color: #6366f1;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Olá, <span>Mundo!</span></h1>
        <p>Minha primeira página com um fundo bem estiloso.</p>
    </div>

</body>
</html>
