<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olá Mundo com Estilo</title>
    <style>
        /* O CSS começa aqui */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                background: linear-gradient(135deg, #74b9ff, #a29bfe);
        display: flex;
       justify-content: center;
       align-items: center;
       height: 100vh;
       margin: 0;
        }

{
          font-family: 'fantasy', sans-serif;
    background: linear-gradient(135deg, #74b9ff, #a29bfe);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0; 

}

        .card {
              background-color: rgb(247, 247, 247);       /* Mantém o fundo branco */
    padding: 1.5rem 2rem;          /* Menos espaço interno */
    border-radius: 10px;           /* Cantos arredondados, mas mais sutis */
    box-shadow: 0 4px 10px rgba(0,0,0,0.05); /* Sombra suave e discreta */
    text-align: center;
    max-width: 300px;              /* Limita o tamanho para ficar mais clean */
        }

        h1 {
          font-family: 'Optima', sans-serif; /* Troca a fonte do título */
    color: #2d3436;
    margin-bottom: 10px;
    font-weight: 600; /* Deixa mais marcante */
        }

        p {
            color: #000000;
        }

        span {
            color: #2977f4;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Olá, <span>Mundo!</span></h1>
        <p>Minha primeira página estilizada com CSS</p>
    </div>

</body>
</html>
