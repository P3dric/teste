<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olá Mundo Neon - Buraco Negro</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            /* Fundo de buraco negro realista (primeira foto oficial) */
            background-image: url('https://d2pn8kiwq2w21t.cloudfront.net/original_images/eht_blackhole.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            /* Fallback escuro caso a imagem demore */
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .card {
            background-color: rgba(10, 10, 30, 0.4); /* Semi-transparente escuro */
            backdrop-filter: blur(12px);             /* Efeito vidro fosco */
            -webkit-backdrop-filter: blur(12px);
            padding: 2.5rem 3rem;
            border-radius: 20px;
            text-align: center;
            max-width: 420px;
            position: relative;
            overflow: hidden;

            /* Bordas neon + glow */
            border: 2px solid transparent;
            box-shadow: 
                0 0 20px #00f0ff,
                0 0 40px #00f0ff,
                inset 0 0 20px #00f0ff;          /* Glow interno */
            animation: neon-pulse 3s infinite alternate;
        }

        /* Animação de pulso neon */
        @keyframes neon-pulse {
            from {
                box-shadow: 
                    0 0 10px #00f0ff,
                    0 0 20px #00f0ff,
                    0 0 40px #2977f4,
                    inset 0 0 10px #00f0ff;
            }
            to {
                box-shadow: 
                    0 0 20px #ff00ff,
                    0 0 40px #ff00ff,
                    0 0 80px #a29bfe,
                    inset 0 0 30px #ff00ff;
            }
        }

        h1 {
            font-family: Papyrus, "Chalkduster", fantasy, cursive, sans-serif;
            font-size: 4.5rem;
            font-weight: 900;
            margin: 0 0 1rem 0;
            color: #ffffff;
            text-shadow: 
                0 0 10px #00f0ff,
                0 0 20px #00f0ff,
                0 0 40px #2977f4,
                0 0 60px #a29bfe;  /* Glow neon forte no texto */
            letter-spacing: 2px;
        }

        p {
            color: #e0f7ff;
            font-size: 1.4rem;
            margin: 0;
            text-shadow: 0 0 8px #00f0ff;
        }

        span {
            color: #00f0ff;
            font-weight: bold;
            text-shadow: 0 0 15px #00f0ff;
        }

        /* Partículas sutis de estrelas (opcional, mas dá vibe espaço) */
        .stars {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            background: transparent;
            overflow: hidden;
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.8;
            animation: twinkle 5s infinite;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Estrelas de fundo (efeito sutil) -->
    <div class="stars"></div>

    <div class="card">
        <h1>Olá, <span>Mundo!</span></h1>
        <p>Minha primeira página estilizada com CSS 🌌</p>
    </div>

    <script>
        // Gera estrelas aleatórias no fundo (opcional)
        const starsContainer = document.querySelector('.stars');
        for (let i = 0; i < 80; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            star.style.width = star.style.height = Math.random() * 3 + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 5 + 's';
            starsContainer.appendChild(star);
        }
    </script>

</body>
</html>
