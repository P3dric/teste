<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Via Láctea – 2026</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            min-height:100vh;
            background:#000;
            color:#e0f7ff;
            font-family:system-ui, sans-serif;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            text-align:center;
            padding:1.5rem;
            position:relative;
            overflow:hidden;
            
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><text x='0' y='24' font-size='28' fill='white'>⭐</text></svg>"), auto;
        }
        body::before {
            content:"";
            position:fixed;
            inset:0;
            background:radial-gradient(circle at center, rgba(10,20,40,0.4) 0%, #000 75%);
            z-index:-2;
        }
        .stars {
            position:fixed;
            inset:0;
            pointer-events:none;
            z-index:-1;
        }
        .star {
            position:absolute;
            background:#fff;
            border-radius:50%;
            opacity:0.6;
            animation:twinkle 8s infinite ease-in-out;
        }
        @keyframes twinkle {
            0%,100% { opacity:0.4; }
            50%     { opacity:0.9; }
        }
        .content { max-width:960px; z-index:1; }
        h1 {
            font-size:clamp(4rem, 12vw, 7.5rem);
            font-weight:900;
            color:#fff;
            letter-spacing:3px;
            margin-bottom:1rem;
            text-shadow:0 0 18px rgba(0,220,255,0.5);
        }
        .subtitle {
            font-size:clamp(1.3rem, 4vw, 1.6rem);
            color:#c0e0ff;
            margin-bottom:2.5rem;
            max-width:700px;
            opacity:0.9;
        }
        .menu {
            display:flex;
            flex-wrap:wrap;
            justify-content:center;
            gap:1.2rem 2rem;
        }
        .btn {
            padding:1rem 2.2rem;
            font-size:1.2rem;
            color:#fff;
            text-decoration:none;
            background:rgba(255,255,255,0.07);
            border:1px solid rgba(0,220,255,0.4);
            border-radius:10px;
            backdrop-filter:blur(10px);
            transition:all 0.3s ease;
            min-width:280px;
            box-shadow:0 4px 15px rgba(0,0,0,0.5);
            text-align:center;
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><text x='0' y='24' font-size='28' fill='white'>⭐</text></svg>"), pointer;
        }
        .btn:hover {
            background:rgba(0,220,255,0.2);
            border-color:#00d4ff;
            transform:translateY(-5px);
            box-shadow:0 0 25px rgba(0,220,255,0.6);
        }
        .btn.official { border-color:rgba(0,255,200,0.5); }
        .btn.official:hover {
            background:rgba(0,255,200,0.25);
            border-color:#00ffc8;
            box-shadow:0 0 30px rgba(0,255,200,0.7);
        }

        /* Player invisível */
        .bg-audio {
            position: fixed;
            top: -9999px;
            left: -9999px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
            z-index: -999;
        }

        /* Overlay para ativar som */
        #audio-unlocker {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            color: #e0f7ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            z-index: 999;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: opacity 0.8s;
        }
        #audio-unlocker:hover {
            background: rgba(0,0,0,0.4);
        }

        @media (max-width: 700px) {
            .menu { gap:1rem 1.5rem; }
            .btn { min-width:260px; padding:0.9rem 1.8rem; font-size:1.1rem; }
        }
        @media (prefers-reduced-motion: reduce) {
            .star, .btn { animation:none !important; transform:none !important; }
        }
    </style>
</head>
<body>

    <!-- Overlay inicial para ativar som (some após clique) -->
    <div id="audio-unlocker">Clique em qualquer lugar para ativar o som cósmico 🌌</div>

    <!-- Música de fundo: Space Ambient Music – Deep Relaxation -->
    <div class="bg-audio">
        <iframe 
            id="bg-iframe"
            width="1" 
            height="1" 
            src="https://www.youtube.com/embed/X-XZx1o_w-A?autoplay=1&mute=1&loop=1&playlist=X-XZx1o_w-A&controls=0&showinfo=0&rel=0&modestbranding=1"
            title="Space Ambient Music • Deep Relaxation Space Scenes"
            frameborder="0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
        </iframe>
    </div>

    <div class="stars"></div>

    <div class="content">
        <h1>Via Láctea Cósmica</h1>
        <p class="subtitle">   Fontes oficiais atualizadas – Março 2026<br>

        <nav class="menu">
            <a href="https://www.nasa.gov/missions/roman-space-telescope/journey-to-center-of-milky-way-with-upcoming-nasa-roman-core-survey" target="_blank" rel="noopener noreferrer" class="btn official">NASA – Centro da Via Láctea com Roman (Jan 2026)</a>
            <a href="https://www.eso.org/public/news/eso2603/" target="_blank" rel="noopener noreferrer" class="btn official">ESO/ALMA – Maior Imagem do Coração da Via Láctea (Fev 2026)</a>
        </nav>
    </div>

    <script>
        // Gera estrelas piscando
        const starsContainer = document.querySelector('.stars');
        for (let i = 0; i < 100; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            const size = Math.random() * 2.5 + 0.5;
            star.style.width = star.style.height = `${size}px`;
            star.style.left = `${Math.random() * 100}%`;
            star.style.top = `${Math.random() * 100}%`;
            star.style.animationDelay = `${Math.random() * 8}s`;
            starsContainer.appendChild(star);
        }

        // Ativa som ao clicar (remove overlay + unmute + força play)
        document.addEventListener('click', function unlockAudio() {
            const overlay = document.getElementById('audio-unlocker');
            if (overlay) {
                overlay.style.opacity = '0';
                setTimeout(() => overlay.remove(), 800);
            }

            const iframe = document.getElementById('bg-iframe');
            if (iframe) {
                let src = iframe.src;
                // Remove mute=1 e garante autoplay
                src = src.replace('&mute=1', '&mute=0');
                if (!src.includes('mute=0')) {
                    src += '&mute=0';
                }
                // Força reload para aplicar mudanças
                iframe.src = src;
            }

            // Remove listener para não repetir
            document.removeEventListener('click', unlockAudio);
        }, { once: true });
    </script>

</body>
</html>
